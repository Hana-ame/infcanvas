<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>infcanvas</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- HUD 叠层（渲染 canvas 由 Pixi 注入 #app；DOM 层样式见 src/client/style.css） -->
    <div id="hud-top"></div>
    <div id="hud-feed"></div>
    <!-- 科技抽卡池面板（R2-1）：默认折叠，不抢画面；🔩 x/N = 碎片进度 -->
    <details id="hud-tech">
      <summary>🔬 科技</summary>
      <div id="hud-tech-body"></div>
    </details>
    <div id="hud-sel"></div>
    <div id="hud-btns">
      <button id="btn-pause">⏸ 暂停</button>
      <button id="btn-speed">⏩ 速度 ×3</button>
      <button id="btn-follow">🎯 跟随鼠群：开</button>
      <button id="btn-save">💾 存档</button>
      <button id="btn-load">⤴️ 读档</button>
      <button id="btn-new">🎲 新世界</button>
      <button id="btn-tip">📋 地块信息：开</button>
    </div>
    <div id="hud-tip"></div>
    <div id="hud-hint">左键点鼠选中 → 点地面/右键指挥移动｜拖拽平移·滚轮缩放｜空格暂停｜悬停查看地形</div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
